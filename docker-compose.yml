services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noveltrans_app
    restart: always
    ports:
      - "${PORT:-9000}:${PORT:-9000}"
    # All app settings (API keys, JWT_SECRET, Google OAuth, AI provider...) come from .env;
    # the entries below override the ones that must differ inside the container.
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-9000}
      - HOST=0.0.0.0
      - APP_URL=${APP_URL:-http://localhost:9000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:9000}
      # The Prisma schema is SQLite; the file lives on the app_data volume.
      - DATABASE_URL=file:/app/data/tnovel.db
    volumes:
      - app_data:/app/data
      - image_data:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-9000}/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  app_data:
  image_data:
